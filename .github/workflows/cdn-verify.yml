name: verify-live-cdn

on:
  push:
    branches:
      - probeloop-webmcp-challenge
    paths:
      - scripts/remote_verify.mjs
      - .github/workflows/cdn-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify checked-in release
        run: npm run verify
      - name: Select a healthy immutable production origin
        shell: bash
        run: |
          set -euo pipefail
          commit=ac809e7f2795bc2ad359781e935423345041a473
          candidates=(
            "https://cdn.jsdelivr.net/gh/jackson-kuja/Audit-My-Model@${commit}/index.html"
            "https://rawcdn.githack.com/jackson-kuja/Audit-My-Model/${commit}/index.html"
            "https://raw.githack.com/jackson-kuja/Audit-My-Model/${commit}/index.html"
            "https://cdn.statically.io/gh/jackson-kuja/Audit-My-Model/${commit}/index.html"
            "https://gitcdn.link/cdn/jackson-kuja/Audit-My-Model/${commit}/index.html"
          )
          selected=""
          for url in "${candidates[@]}"; do
            rm -f /tmp/candidate.headers /tmp/candidate.html
            code=$(curl --silent --show-error --location --retry 2 --retry-all-errors \
              --dump-header /tmp/candidate.headers --output /tmp/candidate.html \
              --write-out '%{http_code}' "$url" || true)
            type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\\r",""); value=$0} END{sub(/^[^:]+:[[:space:]]*/,"",value); print value}' /tmp/candidate.headers)
            printf '%s | %s | %s\n' "$code" "$type" "$url"
            if [[ "$code" == "200" ]] && [[ "$type" == text/html* ]] && grep -Fq '<title>ProbeLoop — Human-agent repair bench</title>' /tmp/candidate.html; then
              selected="$url"
              break
            fi
          done
          test -n "$selected"
          echo "PROBELOOP_LIVE_URL=$selected" >> "$GITHUB_ENV"
          echo "Selected: $selected"
      - name: Verify public assets
        shell: bash
        run: |
          set -euo pipefail
          root=${PROBELOOP_LIVE_URL%/index.html}
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$root/styles.css" -o /tmp/styles.css
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$root/src/app.js" -o /tmp/app.js
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$root/src/webmcp.js" -o /tmp/webmcp.js
          grep -Fq "documentRef?.modelContext" /tmp/webmcp.js
          grep -Fq "context.registerTool(tool, { signal: controller.signal })" /tmp/webmcp.js
      - name: Install isolated browser verifier
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run clean hosted-browser journey
        run: node scripts/remote_verify.mjs
      - name: Upload live verification screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probeloop-live-verification
          path: artifacts/probeloop-live.png
          if-no-files-found: ignore
