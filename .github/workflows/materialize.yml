name: Materialize ProbeLoop challenge source

on:
  push:
    branches:
      - probeloop-webmcp-challenge

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged release
        uses: actions/checkout@v4
        with:
          ref: probeloop-webmcp-challenge

      - name: Expand audited source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .release/part-* > /tmp/probeloop-source.b64
          base64 --decode /tmp/probeloop-source.b64 > /tmp/probeloop-source.tar.gz
          echo "2f172cc72a02177ffda8e46b2bee27b1fc843736dbad0a67468a1a6760dfdddf  /tmp/probeloop-source.tar.gz" | sha256sum --check
          tar -xzf /tmp/probeloop-source.tar.gz
          rm -rf .release .github/workflows/materialize.yml

      - name: Validate release
        run: npm run verify

      - name: Commit challenge release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ProbeLoop Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize ProbeLoop WebMCP challenge release [materialized]"
          git push origin HEAD:probeloop-webmcp-challenge
