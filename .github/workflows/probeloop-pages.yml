name: deploy-probeloop-pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/probeloop-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: probeloop-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out audited challenge branch
        uses: actions/checkout@v4
        with:
          ref: probeloop-webmcp-challenge
      - name: Verify release
        run: npm run verify
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
