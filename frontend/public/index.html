<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/AuditMyFile.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="AuditMyFile - AI-powered file analysis and auditing tool"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/AuditMyFile.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Inter font -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <title>Audit My File</title>
    <!-- Pre-React authentication check - runs before any React code -->
    <script>
      (function() {
        // Check if we need to redirect authenticated users
        function checkAndRedirect() {
          // Get current path
          var path = window.location.pathname.toLowerCase();
          var publicPaths = ['/login', '/register', '/signup', '/'];
          
          // Only run this check on login/register pages
          if (!publicPaths.includes(path)) return;
          
          // Check authentication
          var isAuthenticated = localStorage.getItem('isAuthenticated') === 'true';
          var session = localStorage.getItem('supabase.auth.token');
          
          if (isAuthenticated || session) {
            console.log('PRE-REACT AUTH CHECK: User is authenticated on public page, redirecting to dashboard');
            window.location.href = '/dashboard';
          }
        }
        
        // Run the check immediately
        checkAndRedirect();
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
